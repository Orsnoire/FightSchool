name: Avatar Workshop Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shared/avatar/**'
      - 'shared/avatar-recolor.mjs'
      - 'scripts/avatar/workshop/**'
      - 'attached_assets/characters/human/**'
      - 'tests/browser/avatar-workshop.mjs'
      - '.github/workflows/avatar-workshop-acceptance.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build:avatar-workshop
      - name: Verify the checked-in workshop matches its sources
        run: git diff --exit-code -- attached_assets/characters/human/rig-prototype-v1/preview/workshop.html
      - name: Install isolated browser test tooling
        run: npx --no-install playwright install chromium
      - run: node tests/browser/avatar-workshop.mjs
      - name: Preserve workshop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatar-workshop-screenshots
          path: artifacts/avatar-workshop
          if-no-files-found: ignore
          retention-days: 7
