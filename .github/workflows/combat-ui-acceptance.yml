name: Combat UI Acceptance

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-24.04 already supplies the Chromium runtime libraries. Avoid
      # reinstalling unrelated system fonts from an unreliable apt mirror.
      - name: Install isolated browser test tooling
        run: |
          # Keep npm ci's application dependency tree identical to the release build.
          npm install --prefix "$RUNNER_TEMP/ui-browser-tools" --no-save --package-lock=false playwright@1.62.1
          ln -s "$RUNNER_TEMP/ui-browser-tools/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/ui-browser-tools/node_modules/playwright/cli.js" install chromium
      - name: Exercise combat overlays at Chromebook and phone sizes
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/combat-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node --import tsx tests/browser/campaign-art.mjs
          node --import tsx tests/browser/campaign.mjs
          node --import tsx tests/browser/advancement.mjs
          node --import tsx tests/browser/combat-ui.mjs
          node --import tsx tests/browser/host-ui.mjs
          node --import tsx tests/browser/host-sessions.mjs
          node --import tsx tests/browser/usability-patch.mjs
          node --import tsx tests/browser/guild-shop.mjs
          node --import tsx tests/browser/guild-sessions.mjs
          node --import tsx tests/browser/guild-roster.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combat-ui-screenshots
          path: artifacts/combat-ui
          if-no-files-found: ignore
          retention-days: 7
  initial-loading:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - name: Install isolated browser test tooling
        run: |
          # Keep npm ci's application dependency tree identical to the release build.
          npm install --prefix "$RUNNER_TEMP/ui-browser-tools" --no-save --package-lock=false playwright@1.62.1
          ln -s "$RUNNER_TEMP/ui-browser-tools/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/ui-browser-tools/node_modules/playwright/cli.js" install chromium
      - name: Verify production loading, polling and editor recovery
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 > /tmp/c07-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          node --import tsx tests/browser/initial-loading.mjs
      - name: Preserve production loading evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: initial-loading-evidence
          path: artifacts/initial-loading
          if-no-files-found: ignore
          retention-days: 7

  battlefield-rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/c08-browser-tools --no-save --package-lock=false playwright@1.62.1
          ln -s /tmp/c08-browser-tools/node_modules/playwright node_modules/playwright
          node /tmp/c08-browser-tools/node_modules/playwright/cli.js install chromium
      - name: Compare C08 with the pinned C07 baseline
        shell: bash
        run: |
          git fetch origin 56a1f758bde901ff9739e5ea0ee8d44d55f7ba91
          git worktree add --detach /tmp/c08-baseline 56a1f758bde901ff9739e5ea0ee8d44d55f7ba91
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/c08-baseline/node_modules
          # Each Vite root needs its own optimizer cache even though packages
          # are shared. Otherwise simultaneous starts overwrite dependency URLs.
          printf "import config from './vite.config'; export default {...config, cacheDir: '/tmp/c08-baseline/.vite-cache'};\n" > /tmp/c08-baseline/c08.vite.config.ts
          (cd /tmp/c08-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/vite" --config c08.vite.config.ts --host 127.0.0.1 --port 4175) > /tmp/c08-before.log 2>&1 &
          baseline_pid=$!
          npx vite --host 127.0.0.1 --port 4173 > /tmp/c08-after.log 2>&1 &
          current_pid=$!
          trap 'kill "$baseline_pid" "$current_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null && curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          comparison_status=0
          C08_LABEL=after UI_ORIGIN=http://127.0.0.1:4173 node --import tsx tests/browser/battlefield-rendering.mjs || comparison_status=1
          C08_LABEL=before UI_ORIGIN=http://127.0.0.1:4175 node --import tsx tests/browser/battlefield-rendering.mjs || comparison_status=1
          exit "$comparison_status"
      - name: Print C08 server diagnostics
        if: failure()
        run: cat /tmp/c08-before.log /tmp/c08-after.log
      - name: Preserve C08 measurements and visual comparisons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: battlefield-rendering-evidence
          path: artifacts/c08-browser
          if-no-files-found: ignore
          retention-days: 7

  authoring-lobby:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/c11-browser-tools --no-save --package-lock=false playwright@1.62.1
          ln -s /tmp/c11-browser-tools/node_modules/playwright node_modules/playwright
          node /tmp/c11-browser-tools/node_modules/playwright/cli.js install chromium
      - name: Verify authoring and lobby against the pinned C10 baseline
        shell: bash
        run: |
          git fetch origin e02f46d7367f8f006a97565fec0d4d5b85ff648b
          git worktree add --detach /tmp/c11-baseline e02f46d7367f8f006a97565fec0d4d5b85ff648b
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/c11-baseline/node_modules
          printf "import config from './vite.config'; export default {...config, cacheDir: '/tmp/c11-baseline/.vite-cache'};\n" > /tmp/c11-baseline/c11.vite.config.ts
          (cd /tmp/c11-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/vite" --config c11.vite.config.ts --host 127.0.0.1 --port 4176) > /tmp/c11-before.log 2>&1 &
          baseline_pid=$!
          npx vite --host 127.0.0.1 --port 4177 > /tmp/c11-after.log 2>&1 &
          current_pid=$!
          trap 'kill "$baseline_pid" "$current_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4176/ > /dev/null && curl --fail --silent http://127.0.0.1:4177/ > /dev/null; then break; fi
            sleep 1
          done
          C11_BASELINE=1 C11_LABEL=before UI_ORIGIN=http://127.0.0.1:4176 node --import tsx tests/browser/authoring-lobby.mjs
          C11_LABEL=after UI_ORIGIN=http://127.0.0.1:4177 node --import tsx tests/browser/authoring-lobby.mjs
      - name: Print authoring/lobby diagnostics
        if: failure()
        run: cat /tmp/c11-before.log /tmp/c11-after.log
      - name: Preserve authoring and lobby evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authoring-lobby-evidence
          path: artifacts/c11-browser
          if-no-files-found: ignore
          retention-days: 7
