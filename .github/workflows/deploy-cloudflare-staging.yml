name: Deploy Cloudflare Staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full merge commit SHA of the reviewed release PR
        required: true
      release_pr:
        description: Merged release PR number
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: questacademy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-staging
    steps:
      - name: Validate immutable release input
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: '[[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Require the exact reviewed tree and successful checks
        run: node scripts/release/verify.mjs review
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_PR: ${{ inputs.release_pr }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:cloudflare
      - name: Ensure image storage bucket
        run: node scripts/ensure-r2.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply additive database migrations
        run: npm run db:migrate:cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Prepare Worker secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$PASSWORD_PEPPER"
          test -n "$SESSION_SECRET"
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "STAGING_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          export STAGING_AUTH_TOKEN="$token"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/questacademy-secrets.json", JSON.stringify({ DATABASE_URL: process.env.DATABASE_URL, PASSWORD_PEPPER: process.env.PASSWORD_PEPPER, SESSION_SECRET: process.env.SESSION_SECRET, STAGING_AUTH_TOKEN: process.env.STAGING_AUTH_TOKEN }))'
      - name: Deploy the pinned release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npx --no-install wrangler deploy --config wrangler.jsonc --secrets-file "$RUNNER_TEMP/questacademy-secrets.json" --var "RELEASE_SHA:$RELEASE_SHA"
      - name: Verify the deployed identity on both hostnames
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          STAGING_ORIGIN=https://questacademy-staging.coxsonator.workers.dev node scripts/release/verify.mjs observe
          STAGING_ORIGIN=https://questacademy.bookwyrminteractive.studio node scripts/release/verify.mjs observe
      - name: Verify staging
        run: node tests/phase2/staging-smoke.mjs
        env:
          STAGING_ORIGIN: https://questacademy-staging.coxsonator.workers.dev
          STAGING_AUTH_TOKEN: ${{ env.STAGING_AUTH_TOKEN }}
      - name: Verify canonical domain
        run: node tests/phase2/staging-smoke.mjs
        env:
          STAGING_ORIGIN: https://questacademy.bookwyrminteractive.studio
          STAGING_AUTH_TOKEN: ${{ env.STAGING_AUTH_TOKEN }}
      - name: Remove temporary secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/questacademy-secrets.json"
      - name: Preserve release identity and review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.release_sha }}
          path: artifacts/release
          retention-days: 30
          if-no-files-found: error
