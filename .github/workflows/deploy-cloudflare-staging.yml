name: Deploy Cloudflare Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:baseline
      - run: npm test
      - run: npm run build:cloudflare
      - name: Prepare Worker secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$PASSWORD_PEPPER"
          test -n "$SESSION_SECRET"
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "STAGING_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          export STAGING_AUTH_TOKEN="$token"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/questacademy-secrets.json", JSON.stringify({ DATABASE_URL: process.env.DATABASE_URL, PASSWORD_PEPPER: process.env.PASSWORD_PEPPER, SESSION_SECRET: process.env.SESSION_SECRET, STAGING_AUTH_TOKEN: process.env.STAGING_AUTH_TOKEN }))'
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc --secrets-file ${{ runner.temp }}/questacademy-secrets.json
      - name: Verify staging
        run: node tests/phase2/staging-smoke.mjs
        env:
          STAGING_ORIGIN: https://questacademy-staging.coxsonator.workers.dev
          STAGING_AUTH_TOKEN: ${{ env.STAGING_AUTH_TOKEN }}
