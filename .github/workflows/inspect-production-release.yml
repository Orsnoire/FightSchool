name: Inspect Production Release

on:
  workflow_dispatch:
  push:
    branches: [release/campaign-safe-upgrade]
    paths: [deploy/production-preflight.json]

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/deployment/*.test.mjs
      - name: Read provider identity and database history
        run: node scripts/inspect-production-release.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v6
        with:
          name: production-inspection
          path: artifacts/release/production-inspection.json
          if-no-files-found: error
          retention-days: 30
