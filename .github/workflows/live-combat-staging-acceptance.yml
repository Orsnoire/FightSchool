name: Live Combat Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      staging_origin:
        description: Staging Worker origin
        required: false
        default: https://questacademy-staging.coxsonator.workers.dev
  pull_request:
    paths:
      - ".github/workflows/live-combat-staging-acceptance.yml"
      - "tests/staging/live-combat-acceptance.mjs"

permissions:
  contents: read

concurrency:
  group: live-combat-staging-acceptance
  cancel-in-progress: false

jobs:
  accept:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cloudflare-migration/live-combat-agentic-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exercise live teacher and student combat
        env:
          STAGING_ORIGIN: ${{ inputs.staging_origin || 'https://questacademy-staging.coxsonator.workers.dev' }}
        run: node tests/staging/live-combat-acceptance.mjs
