name: Live Combat Staging Acceptance

on:
  push:
    branches: [main]
    paths: [deploy/production-acceptance.json]
  workflow_dispatch:
    inputs:
      staging_origin:
        description: Staging Worker origin
        required: false
        default: https://questacademy-staging.coxsonator.workers.dev
  pull_request:
    paths:
      - ".github/workflows/live-combat-staging-acceptance.yml"
      - "tests/staging/live-combat-acceptance.mjs"

permissions:
  contents: read

concurrency:
  group: live-combat-staging-acceptance
  cancel-in-progress: false

jobs:
  accept:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'cloudflare-migration/live-combat-agentic-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify explicit production acceptance request
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const request=JSON.parse(readFileSync('deploy/production-acceptance.json','utf8'));
          assert.equal(request.mode,'verify');
          assert.match(request.sourceSha,/^[a-f0-9]{40}$/);
          assert.equal(request.origin,'https://questacademy.bookwyrminteractive.studio');
          const ready=await fetch(request.origin+'/api/health/ready',{redirect:'error',signal:AbortSignal.timeout(30000)});
          assert.equal(ready.status,200);
          assert.equal((await ready.json()).status,'ready');
          JS
      - name: Exercise live teacher and student combat
        env:
          STAGING_ORIGIN: ${{ inputs.staging_origin || (github.event_name == 'push' && 'https://questacademy.bookwyrminteractive.studio') || 'https://questacademy-staging.coxsonator.workers.dev' }}
        run: node tests/staging/live-combat-acceptance.mjs
      - name: Exercise storage and classroom concurrency
        env:
          STAGING_ORIGIN: ${{ inputs.staging_origin || (github.event_name == 'push' && 'https://questacademy.bookwyrminteractive.studio') || 'https://questacademy-staging.coxsonator.workers.dev' }}
        run: node tests/staging/operational-acceptance.mjs
