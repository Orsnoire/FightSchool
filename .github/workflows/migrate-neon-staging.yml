name: Migrate Neon Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-staging-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply committed migrations
        run: npm run db:migrate:cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
